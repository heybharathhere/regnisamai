<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Regnisamai — Reverse Singer</title>
<meta name="theme-color" content="#1B1815" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Space+Mono:wght@400;700&family=Caveat:wght@600;700&display=swap');

/* ---------- Design tokens ---------- */
:root{
  --ink:        #1B1815;
  --panel:      #231F1B;
  --paper:      #F3EEE3;
  --tape:       #D8CBB3;
  --amber:      #E3963E;
  --rust:       #C1432E;
  --amber-dim:  #8a5c26;
  --rust-dim:   #7a2c1f;
  --key-face:       #3A342D;
  --key-face-light: #48413A;
  --key-shadow:     #0E0C0A;
}
[data-theme="midnight"]{
  --ink:        #0E1116;
  --panel:      #171B22;
  --paper:      #E9F1F5;
  --tape:       #9FB3C4;
  --amber:      #6FD8E0;
  --rust:       #9B6BE0;
  --amber-dim:  #3E7A80;
  --rust-dim:   #5A3E8C;
  --key-face:       #232933;
  --key-face-light: #2E3540;
  --key-shadow:     #06080B;
}
[data-theme="sunburst"]{
  --ink:        #F6EFDF;
  --panel:      #FFFBF2;
  --paper:      #2B2013;
  --tape:       #7A6A4F;
  --amber:      #C77A17;
  --rust:       #A6401F;
  --amber-dim:  #E4B471;
  --rust-dim:   #D08D74;
  --key-face:       #EADFC5;
  --key-face-light: #F7EFD9;
  --key-shadow:     #C9BC9C;
}

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--ink);
  color:var(--paper);
  font-family:'Space Mono', monospace;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input{ font-family:inherit; }

.app-shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  padding:20px 18px 40px;
  display:flex;
  flex-direction:column;
  gap:22px;
}

/* ---------- Header ---------- */
header{ padding-top:6px; }
.eyebrow{
  font-size:11px;
  letter-spacing:0.18em;
  color:var(--tape);
  opacity:0.75;
  text-transform:uppercase;
  margin-bottom:6px;
}
.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
h1{
  font-family:'Big Shoulders Display', sans-serif;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:0.01em;
  font-size:clamp(34px, 9vw, 46px);
  color:var(--amber);
  margin:0;
  line-height:0.9;
}
.subtitle{
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--tape);
  opacity:0.8;
  margin-top:4px;
}
.icon-btn{
  width:42px; height:42px;
  border-radius:50%;
  background:var(--panel);
  border:1px solid var(--key-shadow);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  font-size:19px;
  color:var(--tape);
}
.icon-btn:active{ transform:translateY(1px); }

/* ---------- Deck ---------- */
.deck{
  background:var(--panel);
  border-radius:18px;
  padding:22px 18px 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.02);
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* Reels + tape */
.reels-wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 4px;
}
.reel{
  width:78px; height:78px;
  border-radius:50%;
  flex-shrink:0;
  position:relative;
  background: repeating-conic-gradient(var(--key-face-light) 0deg 14deg, var(--key-face) 14deg 28deg);
  border:3px solid var(--key-shadow);
  transition: filter 0.25s ease;
  filter: saturate(0.5) brightness(0.75);
}
.reel::after{
  content:"";
  position:absolute; top:50%; left:50%;
  width:22px; height:22px;
  border-radius:50%;
  background:var(--panel);
  border:3px solid var(--key-shadow);
  transform:translate(-50%,-50%);
}
.reel.spin{ animation: reelSpin 2.6s linear infinite; }
.reel.spin-rev{ animation-direction: reverse; }
.reels-wrap.active-fwd .reel{ filter: saturate(1) brightness(1); box-shadow: 0 0 14px var(--amber-dim); border-color: var(--amber-dim); }
.reels-wrap.active-rev .reel{ filter: saturate(1) brightness(1); box-shadow: 0 0 14px var(--rust-dim); border-color: var(--rust-dim); }
@keyframes reelSpin{ to{ transform:rotate(360deg); } }

.tape-track{
  flex:1;
  height:14px;
  overflow:hidden;
  position:relative;
  margin:0 2px;
}
.tape-track::before{
  content:"";
  position:absolute; top:50%; left:-40px; right:-40px;
  height:3px;
  transform:translateY(-50%);
  background-image: repeating-linear-gradient(90deg, var(--tape) 0 8px, transparent 8px 20px);
  opacity:0.55;
}
.tape-strip{
  position:absolute; top:50%; left:-40px; right:-40px;
  height:3px;
  transform:translateY(-50%);
  background-image: repeating-linear-gradient(90deg, var(--amber) 0 8px, transparent 8px 20px);
  opacity:0;
  transition: opacity 0.2s ease;
}
.reels-wrap.active-fwd .tape-strip{ opacity:1; background-image: repeating-linear-gradient(90deg, var(--amber) 0 8px, transparent 8px 20px); animation: scrollFwd 0.7s linear infinite; }
.reels-wrap.active-rev .tape-strip{ opacity:1; background-image: repeating-linear-gradient(90deg, var(--rust) 0 8px, transparent 8px 20px); animation: scrollRev 0.7s linear infinite; }
.reels-wrap.halt .tape-strip{ animation-play-state: paused; }
@keyframes scrollFwd{ to{ background-position-x: -28px; } }
@keyframes scrollRev{ to{ background-position-x: 28px; } }

/* Status window */
.status-window{
  background:var(--ink);
  border-radius:10px;
  padding:12px 16px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border:1px solid rgba(0,0,0,0.4);
}
.counter{
  font-size:22px;
  font-weight:700;
  letter-spacing:0.03em;
  color:var(--amber);
  font-variant-numeric: tabular-nums;
}
.status-text{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:var(--tape);
  opacity:0.85;
}

/* Waveform */
.waveform{
  height:56px;
  background:var(--ink);
  border-radius:10px;
  padding:8px 10px;
  border:1px solid rgba(0,0,0,0.4);
}
.waveform canvas{ width:100%; height:100%; display:block; }

/* Key cluster */
.key-cluster{
  display:grid;
  grid-template-columns: repeat(5, 1fr);
  gap:8px;
}
.key{
  background:var(--key-face);
  border-radius:10px;
  padding:12px 4px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  box-shadow:
    inset 0 1px 0 var(--key-face-light),
    0 4px 0 var(--key-shadow);
  transform:translateY(0);
  transition: transform 0.06s ease, box-shadow 0.06s ease;
}
.key:active:not(:disabled), .key.pressed{
  transform:translateY(4px);
  box-shadow: inset 0 1px 0 var(--key-face-light), 0 0 0 var(--key-shadow);
}
.key:disabled{ opacity:0.35; cursor:default; }
.key-icon{ width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
.key-label{ font-size:9px; letter-spacing:0.08em; color:var(--tape); }

.icon-rec{ width:14px; height:14px; border-radius:50%; background:var(--rust); }
.key[data-key="rec"].active .icon-rec{ animation: pulse 1s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:0.5; transform:scale(0.82);} }
.icon-play{ width:0; height:0; border-top:9px solid transparent; border-bottom:9px solid transparent; border-left:14px solid var(--amber); }
.icon-pause{ display:flex; gap:4px; }
.icon-pause span{ width:5px; height:16px; background:var(--paper); display:block; }
.icon-rev{ width:0; height:0; border-top:9px solid transparent; border-bottom:9px solid transparent; border-right:14px solid var(--rust); }
.icon-stop{ width:14px; height:14px; background:var(--paper); }

/* Vari-speed steppers */
.vari-speed{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:10px;
}
.stepper{
  background:var(--ink);
  border-radius:10px;
  padding:10px 12px 12px;
  border:1px solid rgba(0,0,0,0.4);
}
.stepper-label{
  font-size:10px; letter-spacing:0.12em; color:var(--tape); opacity:0.75; margin-bottom:8px; text-align:center;
}
.stepper-row{
  display:flex; align-items:center; justify-content:space-between;
}
.step-btn{
  width:32px; height:32px;
  border-radius:8px;
  background:var(--key-face);
  font-size:18px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  box-shadow: inset 0 1px 0 var(--key-face-light), 0 3px 0 var(--key-shadow);
}
.step-btn:active{ transform:translateY(3px); box-shadow: inset 0 1px 0 var(--key-face-light), 0 0 0 var(--key-shadow); }
.stepper-value{
  font-size:15px; font-weight:700; color:var(--paper); font-variant-numeric: tabular-nums;
  min-width:56px; text-align:center;
}

/* ---------- History ---------- */
.history{ display:flex; flex-direction:column; gap:10px; }
.history-header{
  font-size:11px; letter-spacing:0.14em; color:var(--tape); opacity:0.7; text-transform:uppercase;
  padding-left:2px;
}
.history-list{ display:flex; flex-direction:column; gap:8px; }
.history-empty{
  font-size:12px; color:var(--tape); opacity:0.55; padding:14px 4px; text-align:center;
}
.history-row-wrap{ position:relative; overflow:hidden; border-radius:10px; }
.history-row-delete{
  position:absolute; inset:0; background:var(--rust);
  display:flex; align-items:center; justify-content:flex-end; padding-right:18px;
  color:var(--paper); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
}
.history-row{
  position:relative;
  background:var(--panel);
  border-radius:10px;
  padding:12px 14px;
  display:flex; align-items:center; justify-content:space-between;
  gap:10px;
  touch-action: pan-y;
}
.history-row-main{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.history-row-label{ font-size:13px; color:var(--paper); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.history-row-dur{ font-size:11px; color:var(--tape); opacity:0.7; }
.history-row-del-x{ font-size:16px; color:var(--tape); opacity:0.5; padding:4px 6px; flex-shrink:0; }

/* ---------- Footer ---------- */
.footer-tag{
  text-align:center;
  font-size:11px;
  color:var(--tape);
  opacity:0.55;
  letter-spacing:0.04em;
  padding-top:4px;
}

/* ---------- Overlays (onboarding / tutorial) ---------- */
.overlay{
  position:fixed; inset:0; z-index:60;
  background:var(--ink);
  display:flex; flex-direction:column;
}
.overlay.hidden{ display:none; }

/* Onboarding */
.onboarding-inner{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 24px; gap:28px; text-align:center;
}
.onboarding-title{
  font-family:'Big Shoulders Display', sans-serif; font-weight:900; text-transform:uppercase;
  color:var(--amber); font-size:clamp(26px,7vw,34px); letter-spacing:0.01em;
}
.onboarding-sub{ font-size:12px; color:var(--tape); letter-spacing:0.08em; text-transform:uppercase; margin-top:-16px; }
.name-input{
  width:100%; max-width:280px;
  background:var(--panel);
  border:1px solid var(--key-shadow);
  border-radius:10px;
  padding:14px 16px;
  color:var(--paper);
  font-size:15px;
  text-align:center;
  outline:none;
}
.name-input:focus{ box-shadow: 0 0 0 2px var(--amber); }
.name-input::placeholder{ color:var(--tape); opacity:0.5; }

.avatar-filmstrip-wrap{ position:relative; width:100%; max-width:340px; height:130px; }
.avatar-filmstrip{
  display:flex; gap:18px;
  height:100%;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding:0 calc(50% - 45px);
  align-items:center;
  scrollbar-width:none;
}
.avatar-filmstrip::-webkit-scrollbar{ display:none; }
.avatar-opt{
  scroll-snap-align:center;
  flex-shrink:0;
  width:90px; height:90px;
  border-radius:50%;
  object-fit:cover;
  opacity:0.4;
  transform:scale(0.82);
  transition: opacity 0.2s ease, transform 0.2s ease;
  background:var(--panel);
}
.avatar-opt.selected{ opacity:1; transform:scale(1); }
.reel-window{
  position:absolute; top:50%; left:50%;
  width:96px; height:96px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:3px solid var(--amber);
  pointer-events:none;
  box-shadow: 0 0 0 4000px rgba(27,24,21,0.0);
}
.primary-btn{
  background:var(--amber);
  color:var(--ink);
  font-weight:700;
  font-size:14px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  padding:14px 32px;
  border-radius:10px;
  box-shadow: 0 4px 0 var(--amber-dim);
}
.primary-btn:active{ transform:translateY(4px); box-shadow:none; }
.primary-btn:disabled{ opacity:0.4; }

/* Tutorial spotlight */
.tutorial-overlay{ background:transparent; pointer-events:none; }
.spotlight-box{
  position:fixed;
  border-radius:16px;
  box-shadow: 0 0 0 9999px rgba(10,8,6,0.82);
  transition: top 0.35s ease, left 0.35s ease, width 0.35s ease, height 0.35s ease;
  pointer-events:none;
}
.tutorial-note{
  position:fixed;
  max-width:220px;
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:22px;
  color:var(--paper);
  transform:rotate(-2deg);
  transition: top 0.35s ease, left 0.35s ease;
  pointer-events:none;
  line-height:1.15;
}
.tutorial-note svg{ display:block; margin-top:2px; }
.tutorial-controls{
  position:fixed; bottom:26px; left:0; right:0;
  display:flex; justify-content:center; gap:14px;
  pointer-events:auto;
}
.tutorial-controls button{
  padding:11px 22px; border-radius:9px; font-size:13px; letter-spacing:0.05em; text-transform:uppercase;
}
.tutorial-skip{ color:var(--tape); border:1px solid var(--tape); }
.tutorial-next{ background:var(--amber); color:var(--ink); font-weight:700; }

/* ---------- Settings bottom sheet ---------- */
.sheet{ position:fixed; inset:0; z-index:70; }
.sheet.hidden{ display:none; }
.sheet-backdrop{ position:absolute; inset:0; background:rgba(10,8,6,0.6); }
.sheet-panel{
  position:absolute; left:0; right:0; bottom:0;
  max-width:480px; margin:0 auto;
  max-height:82vh;
  background:var(--panel);
  border-radius:20px 20px 0 0;
  padding:10px 0 max(18px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column;
  box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
  overflow:hidden;
}
.sheet-grabber{ width:40px; height:4px; background:var(--tape); opacity:0.4; border-radius:2px; margin:6px auto 12px; }
.sheet-scroll{ overflow-y:auto; padding:0 18px 8px; }
.sheet-title{ font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:var(--tape); opacity:0.7; padding:0 4px 12px; }

.setting-row{
  display:flex; align-items:center; gap:10px;
  background:var(--ink);
  border-radius:10px;
  padding:12px 12px;
  margin-bottom:8px;
}
.setting-row-main{ flex:1; display:flex; align-items:center; gap:10px; text-align:left; }
.setting-row-label{ font-size:14px; color:var(--paper); }
.setting-reorder{ display:flex; flex-direction:column; gap:2px; }
.reorder-btn{ font-size:10px; color:var(--tape); opacity:0.6; padding:2px 4px; }
.reorder-btn:active{ opacity:1; }
.setting-chevron{ color:var(--tape); opacity:0.5; font-size:14px; }

.switch{ width:42px; height:24px; border-radius:12px; background:var(--key-shadow); position:relative; flex-shrink:0; transition:background 0.15s; }
.switch.on{ background:var(--amber); }
.switch::after{ content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--paper); transition:transform 0.15s; }
.switch.on::after{ transform:translateX(18px); }

.destructive{ color:var(--rust); }

.sheet-detail{ display:none; flex-direction:column; padding:0 18px 8px; overflow-y:auto; }
.sheet-detail.active{ display:flex; }
.sheet-list.hidden-list{ display:none; }
.detail-back{
  display:flex; align-items:center; gap:8px; color:var(--tape); font-size:12px;
  letter-spacing:0.06em; text-transform:uppercase; padding:6px 4px 14px;
}
.detail-heading{ font-size:18px; color:var(--amber); font-weight:700; margin-bottom:14px; }

.detail-field-label{ font-size:10px; letter-spacing:0.1em; color:var(--tape); opacity:0.7; text-transform:uppercase; margin:14px 0 6px; }
.detail-avatar-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-top:6px; }
.detail-avatar-grid img{ width:100%; border-radius:50%; opacity:0.5; }
.detail-avatar-grid img.selected{ opacity:1; box-shadow: 0 0 0 3px var(--amber); }

.theme-swatch-row{ display:flex; align-items:center; justify-content:space-between; background:var(--panel); border-radius:10px; padding:12px; margin-bottom:8px; }
.theme-swatch-dots{ display:flex; gap:4px; }
.theme-dot{ width:16px; height:16px; border-radius:50%; }
.theme-name{ font-size:13px; }
.theme-check{ color:var(--amber); font-size:14px; opacity:0; }
.theme-swatch-row.active .theme-check{ opacity:1; }

.detail-p{ font-size:13px; color:var(--tape); line-height:1.6; margin:4px 0; }
.detail-btn{
  background:var(--key-face); padding:12px; border-radius:10px; text-align:center; font-size:13px;
  letter-spacing:0.04em; text-transform:uppercase; margin-top:14px;
}
.detail-btn.destructive-btn{ background:var(--rust-dim); color:var(--paper); }
iframe.terms-frame{ width:100%; height:340px; border:none; border-radius:10px; background:var(--ink); margin-top:8px; }

@media (max-width: 360px){
  .key-label{ font-size:8px; }
}
</style>
</head>
<body>

<!-- ============ ONBOARDING ============ -->
<div id="onboarding" class="overlay hidden">
  <div class="onboarding-inner">
    <div>
      <div class="onboarding-title">Welcome to the deck</div>
      <div class="onboarding-sub">Tell us who's recording</div>
    </div>
    <input id="nameInput" class="name-input" type="text" placeholder="Your name" maxlength="24" autocomplete="off" />

    <div class="avatar-filmstrip-wrap">
      <div class="reel-window"></div>
      <div id="avatarFilmstrip" class="avatar-filmstrip"></div>
    </div>

    <button id="letsGoBtn" class="primary-btn" disabled>Let's go</button>
  </div>
</div>

<!-- ============ TUTORIAL ============ -->
<div id="tutorial" class="overlay tutorial-overlay hidden">
  <div id="spotlightBox" class="spotlight-box"></div>
  <div id="tutorialNote" class="tutorial-note"></div>
  <div class="tutorial-controls">
    <button id="tutorialSkip" class="tutorial-skip">Skip</button>
    <button id="tutorialNext" class="tutorial-next">Next</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app-shell">
  <header>
    <div class="eyebrow">Record &rarr; Flip &rarr; Play</div>
    <div class="title-row">
      <h1>Regnisamai</h1>
      <button id="gearBtn" class="icon-btn" aria-label="Settings">&#9881;</button>
    </div>
    <div class="subtitle">Reverse Singer</div>
  </header>

  <main class="deck" id="deckMain">
    <section class="reels-wrap" id="reelsWrap">
      <div class="reel" id="reelLeft"></div>
      <div class="tape-track"><div class="tape-strip" id="tapeStrip"></div></div>
      <div class="reel" id="reelRight"></div>
    </section>

    <section class="status-window">
      <div class="counter" id="counter">00:00.0</div>
      <div class="status-text" id="statusText">Ready</div>
    </section>

    <section class="waveform" id="waveformSection">
      <canvas id="waveCanvas"></canvas>
    </section>

    <section class="key-cluster" id="keyCluster">
      <button class="key" data-key="rec" id="keyRec">
        <span class="key-icon"><span class="icon-rec"></span></span>
        <span class="key-label">REC</span>
      </button>
      <button class="key" data-key="play" id="keyPlay" disabled>
        <span class="key-icon"><span class="icon-play"></span></span>
        <span class="key-label">PLAY</span>
      </button>
      <button class="key" data-key="pause" id="keyPause" disabled>
        <span class="key-icon"><span class="icon-pause"><span></span><span></span></span></span>
        <span class="key-label">PAUSE</span>
      </button>
      <button class="key" data-key="rev" id="keyRev" disabled>
        <span class="key-icon"><span class="icon-rev"></span></span>
        <span class="key-label">REV</span>
      </button>
      <button class="key" data-key="stop" id="keyStop" disabled>
        <span class="key-icon"><span class="icon-stop"></span></span>
        <span class="key-label">STOP</span>
      </button>

<script>
(function(){
"use strict";

/* ===================================================================
   REGNISAMAI — app script
   Sections: storage keys, audio engine, wav encoding, state machine,
   UI wiring, onboarding, tutorial, settings sheet, history.
=================================================================== */

/* ---------- storage keys ---------- */
const LS_ONBOARDING   = "regnisamai.onboardingDone";
const LS_PROFILE      = "regnisamai.profile";
const LS_HISTORY      = "regnisamai.history";
const LS_TAKE_COUNTER = "regnisamai.takeCounter";
const LS_SETTINGS_ORDER = "regnisamai.settingsOrder";
const LS_THEME        = "regnisamai.theme";
const LS_CLICK_SOUND  = "regnisamai.clickSound";
const LS_TUTORIAL_SEEN = "regnisamai.tutorialSeen";

const AVATAR_COUNT = 8;
const MAX_HISTORY = 5;

/* ---------- naming formats for history entries ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
const NAMING_FORMATS = {
  recDDMMYYYYHHMM: (d) => `REC${pad(d.getDate())}${pad(d.getMonth()+1)}${d.getFullYear()}${pad(d.getHours())}${pad(d.getMinutes())}`,
  yyyymmddhhmmss:  (d) => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`,
  sideAB:          (d, index) => `SIDE-${index % 2 === 0 ? 'A' : 'B'}-${pad(d.getHours())}${pad(d.getMinutes())}`,
  reelNumber:      (d, index, takeCounter) => `REEL-${String(takeCounter).padStart(3,'0')}`,
  dateDot:         (d) => `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}.${pad(d.getHours())}${pad(d.getMinutes())}`
};
const ACTIVE_NAMING_FORMAT = 'recDDMMYYYYHHMM'; // change this constant to switch formats app-wide

/* ---------- tiny helpers ---------- */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function readJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw === null) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function writeJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* storage full or unavailable */ }
}

/* ===================================================================
   AUDIO ENGINE
=================================================================== */
let audioCtx = null;
function ensureCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];

let forwardBuffer = null;   // AudioBuffer
let reversedBuffer = null;  // AudioBuffer

let currentSource = null;   // active AudioBufferSourceNode
let playStartCtxTime = 0;
let playOffset = 0;         // seconds already consumed, for pause/resume
let recordStartTime = 0;
let recordRAF = null;

/* vari-speed */
let pitchSemitones = 0;   // -12..12
let speedMultiplier = 1.0; // 0.5..2.0
function computeRate(){
  return speedMultiplier * Math.pow(2, pitchSemitones/12);
}

/* click sound (Web Audio synthesized mechanical click) */
function playClick(){
  if(!settings.clickSound) return;
  const ctx = ensureCtx();
  const dur = 0.045;
  const bufferSize = Math.floor(ctx.sampleRate * dur);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    data[i] = (Math.random()*2-1);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;

  const bandpass = ctx.createBiquadFilter();
  bandpass.type = "bandpass";
  bandpass.frequency.value = 2200;
  bandpass.Q.value = 1.1;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.6, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);

  noise.connect(bandpass).connect(gain).connect(ctx.destination);
  noise.start();
  noise.stop(ctx.currentTime + dur);
}

/* ---------- reverse a buffer ---------- */
function reverseAudioBuffer(buffer){
  const ctx = ensureCtx();
  const out = ctx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
  for(let ch=0; ch<buffer.numberOfChannels; ch++){
    const src = buffer.getChannelData(ch);
    const dst = out.getChannelData(ch);
    for(let i=0, j=src.length-1; i<src.length; i++, j--){
      dst[i] = src[j];
    }
  }
  return out;
}

/* ---------- manual WAV encoder (16-bit PCM) ---------- */
function audioBufferToWav(buffer){
  const numCh = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const numFrames = buffer.length;
  const bytesPerSample = 2;
  const blockAlign = numCh * bytesPerSample;
  const dataSize = numFrames * blockAlign;
  const bufferSize = 44 + dataSize;

  const ab = new ArrayBuffer(bufferSize);
  const view = new DataView(ab);

  function writeStr(offset, str){
    for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i));
  }

  writeStr(0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);       // PCM chunk size
  view.setUint16(20, 1, true);        // PCM format
  view.setUint16(22, numCh, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);       // bits per sample
  writeStr(36, "data");
  view.setUint32(40, dataSize, true);

  const channels = [];
  for(let ch=0; ch<numCh; ch++) channels.push(buffer.getChannelData(ch));

  let offset = 44;
  for(let i=0; i<numFrames; i++){
    for(let ch=0; ch<numCh; ch++){
      let sample = Math.max(-1, Math.min(1, channels[ch][i]));
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
      view.setInt16(offset, sample, true);
      offset += 2;
    }
  }

  return new Blob([ab], { type: "audio/wav" });
}

function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function dataURLToAudioBuffer(dataUrl){
  const res = await fetch(dataUrl);
  const arr = await res.arrayBuffer();
  const ctx = ensureCtx();
  return await ctx.decodeAudioData(arr);
}

/* ===================================================================
   WAVEFORM
=================================================================== */
const WAVE_BARS = 48;
let currentWavePeaks = null; // array of 0..1

function computePeaks(buffer, bars){
  const data = buffer.getChannelData(0);
  const blockSize = Math.floor(data.length / bars) || 1;
  const peaks = [];
  for(let i=0;i<bars;i++){
    const start = i*blockSize;
    let max = 0;
    for(let j=0;j<blockSize && (start+j)<data.length;j++){
      const v = Math.abs(data[start+j]);
      if(v > max) max = v;
    }
    peaks.push(Math.min(1, max*1.4));
  }
  return peaks;
}

function drawWaveform(peaks, progressFraction, direction){
  const canvas = $("#waveCanvas");
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,rect.width, rect.height);

  if(!peaks || !peaks.length) return;

  const n = peaks.length;
  const gap = 3;
  const barW = (rect.width - gap*(n-1)) / n;
  const midY = rect.height/2;

  let litIndex = -1;
  if(progressFraction != null){
    if(direction === "rev"){
      litIndex = n - 1 - Math.floor(progressFraction * n);
    } else {
      litIndex = Math.floor(progressFraction * n);
    }
  }

  const activeColor = direction === "rev" ? cssVar("--rust") : cssVar("--amber");
  const dimColor = cssVar("--tape");

  for(let i=0;i<n;i++){
    const h = Math.max(3, peaks[i]*rect.height*0.85);
    const x = i*(barW+gap);
    const y = midY - h/2;
    let lit;
    if(litIndex < 0) lit = false;
    else if(direction === "rev") lit = i >= litIndex;
    else lit = i <= litIndex;
    ctx.fillStyle = lit ? activeColor : dimColor;
    ctx.globalAlpha = lit ? 1 : 0.35;
    ctx.fillRect(x, y, barW, h);
  }
  ctx.globalAlpha = 1;
}

function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ===================================================================
   STATE MACHINE
   states: idle, recording, playing-fwd, playing-rev, paused-fwd, paused-rev
=================================================================== */
let appState = "idle";

const els = {
  keyRec: null, keyPlay: null, keyPause: null, keyRev: null, keyStop: null,
  counter: null, statusText: null, reelsWrap: null
};

function setState(next){
  appState = next;
  updateButtonsForState();
  updateReelsForState();
  updateStatusText();
}

function updateButtonsForState(){
  const s = appState;
  els.keyRec.disabled   = s !== "idle";
  els.keyStop.disabled  = s === "idle";
  els.keyPlay.disabled  = !(forwardBuffer && (s === "idle" || s === "paused-fwd" || s === "paused-rev"));
  els.keyRev.disabled   = !(forwardBuffer && (s === "idle" || s === "paused-fwd" || s === "paused-rev"));
  els.keyPause.disabled = !(s === "playing-fwd" || s === "playing-rev");

  els.keyRec.classList.toggle("active", s === "recording");
}

function updateReelsForState(){
  const wrap = els.reelsWrap;
  const reelL = $("#reelLeft"), reelR = $("#reelRight");
  wrap.classList.remove("active-fwd","active-rev","halt");
  [reelL, reelR].forEach(r => r.classList.remove("spin","spin-rev"));

  if(appState === "recording" || appState === "playing-fwd"){
    wrap.classList.add("active-fwd");
    reelL.classList.add("spin");
    reelR.classList.add("spin");
  } else if(appState === "playing-rev"){
    wrap.classList.add("active-rev");
    reelL.classList.add("spin","spin-rev");
    reelR.classList.add("spin","spin-rev");
  } else if(appState === "paused-fwd" || appState === "paused-rev"){
    wrap.classList.add(appState === "paused-fwd" ? "active-fwd" : "active-rev", "halt");
  }
}

function updateStatusText(){
  const map = {
    "idle": "Ready",
    "recording": "Recording",
    "playing-fwd": "Playing original",
    "playing-rev": "Playing reversed",
    "paused-fwd": "Paused",
    "paused-rev": "Paused"
  };
  els.statusText.textContent = map[appState] || "Ready";
}

function formatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60);
  const d = Math.floor((sec*10)%10);
  return `${pad(m)}:${pad(s)}.${d}`;
}

/* ---------- counter loop ---------- */
let counterRAF = null;
function startCounterLoop(getSeconds, onTick){
  cancelCounterLoop();
  function tick(){
    const secs = getSeconds();
    els.counter.textContent = formatTime(secs);
    if(onTick) onTick(secs);
    counterRAF = requestAnimationFrame(tick);
  }
  tick();
}
function cancelCounterLoop(){
  if(counterRAF){ cancelAnimationFrame(counterRAF); counterRAF = null; }
}

/* ===================================================================
   RECORDING
=================================================================== */
async function startRecording(){
  if(appState !== "idle") return;
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    els.statusText.textContent = "Mic access denied";
    return;
  }
  ensureCtx();
  recordedChunks = [];
  let mimeType = "audio/webm";
  if(!MediaRecorder.isTypeSupported(mimeType)){
    mimeType = "";
  }
  try{
    mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
  }catch(e){
    mediaRecorder = new MediaRecorder(mediaStream);
  }
  mediaRecorder.ondataavailable = (e) => { if(e.data && e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStopped;
  mediaRecorder.start();

  recordStartTime = performance.now();
  setState("recording");
  startCounterLoop(() => (performance.now() - recordStartTime)/1000);
}

async function onRecordingStopped(){
  cancelCounterLoop();
  if(mediaStream){
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  const blob = new Blob(recordedChunks, { type: recordedChunks[0]?.type || "audio/webm" });
  recordedChunks = [];
  if(blob.size === 0){
    setState("idle");
    els.counter.textContent = "00:00.0";
    return;
  }
  try{
    const arrBuf = await blob.arrayBuffer();
    const ctx = ensureCtx();
    const decoded = await ctx.decodeAudioData(arrBuf);
    forwardBuffer = decoded;
    reversedBuffer = reverseAudioBuffer(decoded);
    currentWavePeaks = computePeaks(forwardBuffer, WAVE_BARS);
    drawWaveform(currentWavePeaks, null, "fwd");
    els.counter.textContent = formatTime(forwardBuffer.duration);
    await saveTakeToHistory(forwardBuffer);
  }catch(e){
    console.error("decode failed", e);
  }
  setState("idle");
}

function stopEverything(){
  if(appState === "recording"){
    if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    return; // onstop will set state to idle
  }
  if(currentSource){
    try{ currentSource.onended = null; currentSource.stop(); }catch(e){}
    currentSource = null;
  }
  cancelCounterLoop();
  playOffset = 0;
  els.counter.textContent = formatTime(forwardBuffer ? forwardBuffer.duration : 0);
  els.counter.textContent = "00:00.0";
  drawWaveform(currentWavePeaks, null, "fwd");
  setState("idle");
}

/* ===================================================================
   PLAYBACK
=================================================================== */
function playDirection(direction){
  // direction: "fwd" | "rev"
  const buffer = direction === "fwd" ? forwardBuffer : reversedBuffer;
  if(!buffer) return;

  const resuming = (direction === "fwd" && appState === "paused-fwd") ||
                    (direction === "rev" && appState === "paused-rev");
  if(!resuming) playOffset = 0;

  const ctx = ensureCtx();
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.playbackRate.value = computeRate();
  source.connect(ctx.destination);

  const startOffset = Math.min(playOffset, buffer.duration - 0.001);
  source.start(0, Math.max(0, startOffset));
  playStartCtxTime = ctx.currentTime;
  currentSource = source;

  source.onended = () => {
    if(currentSource !== source) return; // stale
    currentSource = null;
    cancelCounterLoop();
    playOffset = 0;
    drawWaveform(currentWavePeaks, null, direction);
    els.counter.textContent = "00:00.0";
    setState("idle");
  };

  setState(direction === "fwd" ? "playing-fwd" : "playing-rev");

  startCounterLoop(
    () => {
      const rate = computeRate();
      const elapsedRealTime = ctx.currentTime - playStartCtxTime;
      return startOffset + elapsedRealTime * rate;
    },
    (secs) => {
      const frac = Math.max(0, Math.min(1, secs / buffer.duration));
      drawWaveform(currentWavePeaks, frac, direction);
    }
  );
}

function pausePlayback(){
  if(!(appState === "playing-fwd" || appState === "playing-rev")) return;
  const direction = appState === "playing-fwd" ? "fwd" : "rev";
  const buffer = direction === "fwd" ? forwardBuffer : reversedBuffer;
  const ctx = ensureCtx();
  const rate = computeRate();
  const elapsedRealTime = ctx.currentTime - playStartCtxTime;
  playOffset = Math.min(buffer.duration, playOffset + elapsedRealTime * rate);

  if(currentSource){
    try{ currentSource.onended = null; currentSource.stop(); }catch(e){}
    currentSource = null;
  }
  cancelCounterLoop();
  setState(direction === "fwd" ? "paused-fwd" : "paused-rev");
}

/* ===================================================================
   PITCH / SPEED STEPPERS
=================================================================== */
function updateSteppersUI(){
  $("#pitchValue").textContent = `${pitchSemitones > 0 ? "+" : ""}${pitchSemitones} st`;
  $("#speedValue").textContent = `${speedMultiplier.toFixed(1)}x`;
}

function adjustPitch(dir){
  pitchSemitones = Math.max(-12, Math.min(12, pitchSemitones + dir));
  updateSteppersUI();
  liveUpdateRate();
}
function adjustSpeed(dir){
  speedMultiplier = Math.round((speedMultiplier + dir*0.1) * 10) / 10;
  speedMultiplier = Math.max(0.5, Math.min(2.0, speedMultiplier));
  updateSteppersUI();
  liveUpdateRate();
}
function liveUpdateRate(){
  if(currentSource){
    currentSource.playbackRate.value = computeRate();
  }
}

/* ===================================================================
   HISTORY
=================================================================== */
async function saveTakeToHistory(buffer){
  const wavBlob = audioBufferToWav(buffer);
  const dataUrl = await blobToDataURL(wavBlob);

  let history = readJSON(LS_HISTORY, []);
  let takeCounter = readJSON(LS_TAKE_COUNTER, 0) + 1;
  writeJSON(LS_TAKE_COUNTER, takeCounter);

  const now = new Date();
  const label = NAMING_FORMATS[ACTIVE_NAMING_FORMAT](now, history.length, takeCounter);

  const entry = {
    id: `t${Date.now()}`,
    label,
    duration: buffer.duration,
    dataUrl,
    createdAt: now.toISOString()
  };

  history.unshift(entry);
  if(history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  writeJSON(LS_HISTORY, history);
  renderHistory();
}

function clearHistory(){
  writeJSON(LS_HISTORY, []);
  writeJSON(LS_TAKE_COUNTER, 0);
  renderHistory();
}

function renderHistory(){
  const list = $("#historyList");
  const history = readJSON(LS_HISTORY, []);
  list.innerHTML = "";
  if(!history.length){
    const empty = document.createElement("div");
    empty.className = "history-empty";
    empty.textContent = "No takes yet — hit REC to start your first side.";
    list.appendChild(empty);
    return;
  }
  history.forEach((entry) => {
    const wrap = document.createElement("div");
    wrap.className = "history-row-wrap";

    const del = document.createElement("div");
    del.className = "history-row-delete";
    del.textContent = "Delete";
    wrap.appendChild(del);

    const row = document.createElement("div");
    row.className = "history-row";
    row.innerHTML = `
      <div class="history-row-main">
        <div class="history-row-label">${escapeHtml(entry.label)}</div>
        <div class="history-row-dur">${formatTime(entry.duration)}</div>
      </div>
      <button class="history-row-del-x" aria-label="Delete take">&times;</button>
    `;
    wrap.appendChild(row);
    list.appendChild(wrap);

    wireHistoryRow(wrap, row, entry.id);

    row.querySelector(".history-row-del-x").addEventListener("click", (e) => {
      e.stopPropagation();
      removeHistoryEntry(entry.id);
    });

    row.querySelector(".history-row-main").addEventListener("click", () => {
      loadHistoryEntry(entry.id);
    });
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function removeHistoryEntry(id){
  let history = readJSON(LS_HISTORY, []);
  history = history.filter(h => h.id !== id);
  writeJSON(LS_HISTORY, history);
  renderHistory();
}

async function loadHistoryEntry(id){
  const history = readJSON(LS_HISTORY, []);
  const entry = history.find(h => h.id === id);
  if(!entry) return;
  stopEverything();
  try{
    const buffer = await dataURLToAudioBuffer(entry.dataUrl);
    forwardBuffer = buffer;
    reversedBuffer = reverseAudioBuffer(buffer);
    currentWavePeaks = computePeaks(forwardBuffer, WAVE_BARS);
    drawWaveform(currentWavePeaks, null, "fwd");
    els.counter.textContent = formatTime(buffer.duration);
    setTimeout(() => { els.counter.textContent = "00:00.0"; }, 900);
    setState("idle");
  }catch(e){ console.error("failed to load take", e); }
}

/* swipe-to-delete for history rows */
function wireHistoryRow(wrap, row, id){
  let startX = 0, currentX = 0, dragging = false;
  const threshold = 70;

  row.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    dragging = true;
    row.style.transition = "none";
  }, { passive:true });

  row.addEventListener("touchmove", (e) => {
    if(!dragging) return;
    currentX = e.touches[0].clientX - startX;
    if(currentX > 0) currentX = 0;
    row.style.transform = `translateX(${currentX}px)`;
  }, { passive:true });

  row.addEventListener("touchend", () => {
    dragging = false;
    row.style.transition = "transform 0.2s ease";
    if(currentX < -threshold){
      row.style.transform = `translateX(-100%)`;
      setTimeout(() => removeHistoryEntry(id), 180);
    } else {
      row.style.transform = "translateX(0)";
    }
    currentX = 0;
  });
}

/* ===================================================================
   KEY CLUSTER WIRING
=================================================================== */
function wireKeyPress(el, handler){
  el.addEventListener("click", () => {
    if(el.disabled) return;
    playClick();
    handler();
  });
}

/* ===================================================================
   PROFILE / SETTINGS state
=================================================================== */
let settings = {
  clickSound: readJSON(LS_CLICK_SOUND, true),
  theme: readJSON(LS_THEME, "default")
};

const DEFAULT_SETTINGS_ORDER = ["profile","theme","tutorial","terms","credits","clickSound","clearHistory","about"];

function getSettingsOrder(){
  let order = readJSON(LS_SETTINGS_ORDER, null);
  if(!order || !Array.isArray(order) || order.length !== DEFAULT_SETTINGS_ORDER.length){
    order = DEFAULT_SETTINGS_ORDER.slice();
    writeJSON(LS_SETTINGS_ORDER, order);
  }
  return order;
}
function setSettingsOrder(order){ writeJSON(LS_SETTINGS_ORDER, order); }

const SETTINGS_META = {
  profile:      { label: "Profile", type: "nav" },
  theme:        { label: "Theme", type: "nav" },
  tutorial:     { label: "Tutorial", type: "nav" },
  terms:        { label: "Terms & Conditions", type: "nav" },
  credits:      { label: "Credits", type: "nav" },
  clickSound:   { label: "Click sound", type: "toggle" },
  clearHistory: { label: "Clear history", type: "action", destructive: true },
  about:        { label: "About / Version", type: "nav" }
};

function applyTheme(){
  if(settings.theme === "default"){
    document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.setAttribute("data-theme", settings.theme);
  }
}

function renderSettingsList(){
  const order = getSettingsOrder();
  const container = $("#settingsRows");
  container.innerHTML = "";
  order.forEach((key, idx) => {
    const meta = SETTINGS_META[key];
    if(!meta) return;
    const row = document.createElement("div");
    row.className = "setting-row";

    let mainHTML = `<div class="setting-row-main" data-key="${key}"><div class="setting-row-label ${meta.destructive ? 'destructive':''}">${meta.label}</div></div>`;
    row.innerHTML = mainHTML;

    if(meta.type === "toggle"){
      const sw = document.createElement("div");
      sw.className = "switch" + (settings.clickSound ? " on" : "");
      sw.addEventListener("click", () => {
        settings.clickSound = !settings.clickSound;
        writeJSON(LS_CLICK_SOUND, settings.clickSound);
        sw.classList.toggle("on", settings.clickSound);
      });
      row.appendChild(sw);
    } else if(meta.type === "nav"){
      const chev = document.createElement("div");
      chev.className = "setting-chevron";
      chev.textContent = "\u203A";
      row.appendChild(chev);
      row.querySelector(".setting-row-main").addEventListener("click", () => openDetail(key));
    } else if(meta.type === "action"){
      row.querySelector(".setting-row-main").addEventListener("click", () => {
        if(key === "clearHistory"){
          if(confirm("Clear all saved takes? This can't be undone.")){
            clearHistory();
          }
        }
      });
    }

    const reorder = document.createElement("div");
    reorder.className = "setting-reorder";
    const up = document.createElement("button");
    up.className = "reorder-btn"; up.textContent = "\u25B2";
    up.addEventListener("click", (e) => { e.stopPropagation(); moveSetting(idx, -1); });
    const down = document.createElement("button");
    down.className = "reorder-btn"; down.textContent = "\u25BC";
    down.addEventListener("click", (e) => { e.stopPropagation(); moveSetting(idx, 1); });
    reorder.appendChild(up); reorder.appendChild(down);
    row.appendChild(reorder);

    container.appendChild(row);
  });
}

function moveSetting(idx, dir){
  const order = getSettingsOrder();
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= order.length) return;
  [order[idx], order[newIdx]] = [order[newIdx], order[idx]];
  setSettingsOrder(order);
  renderSettingsList();
}

/* ---------- detail views ---------- */
function openDetail(key){
  $("#sheetList").classList.add("hidden-list");
  const detail = $("#sheetDetail");
  detail.classList.add("active");
  detail.innerHTML = renderDetailContent(key);
  wireDetailContent(key, detail);
}
function closeDetail(){
  $("#sheetList").classList.remove("hidden-list");
  const detail = $("#sheetDetail");
  detail.classList.remove("active");
  detail.innerHTML = "";
}

function renderDetailContent(key){
  const backBtn = `<div class="detail-back" data-back="1">&larr; Settings</div>`;
  const profile = readJSON(LS_PROFILE, { name:"", avatar:1 });

  if(key === "profile"){
    let grid = "";
    for(let i=1;i<=AVATAR_COUNT;i++){
      grid += `<img src="./avatar-${i}.png" data-avatar="${i}" class="${profile.avatar===i?'selected':''}" alt="Avatar ${i}"/>`;
    }
    return `${backBtn}
      <div class="detail-heading">Profile</div>
      <div class="detail-field-label">Name</div>
      <input id="profileNameInput" class="name-input" type="text" value="${escapeHtml(profile.name||"")}" maxlength="24" style="max-width:none;text-align:left;"/>
      <div class="detail-field-label">Avatar</div>
      <div class="detail-avatar-grid" id="profileAvatarGrid">${grid}</div>`;
  }

  if(key === "theme"){
    const themes = [
      { id:"default", name:"Amber Reel", dots:["#E3963E","#C1432E","#1B1815"] },
      { id:"midnight", name:"Midnight Static", dots:["#6FD8E0","#9B6BE0","#0E1116"] },
      { id:"sunburst", name:"Sunburst", dots:["#C77A17","#A6401F","#F6EFDF"] }
    ];
    let rows = themes.map(t => `
      <div class="theme-swatch-row ${settings.theme===t.id?'active':''}" data-theme-id="${t.id}">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="theme-swatch-dots">${t.dots.map(c=>`<span class="theme-dot" style="background:${c}"></span>`).join("")}</div>
          <div class="theme-name">${t.name}</div>
        </div>
        <div class="theme-check">&#10003;</div>
      </div>`).join("");
    return `${backBtn}<div class="detail-heading">Theme</div>${rows}`;
  }

  if(key === "tutorial"){
    return `${backBtn}
      <div class="detail-heading">Tutorial</div>
      <div class="detail-p">Replay the guided walkthrough of the deck, the keys, vari-speed, history, and settings.</div>
      <div class="detail-btn" id="replayTutorialBtn">Replay tutorial</div>`;
  }

  if(key === "terms"){
    return `${backBtn}
      <div class="detail-heading">Terms &amp; Conditions</div>
      <iframe class="terms-frame" src="./terms.html"></iframe>
      <a class="detail-p" href="./terms.html" target="_blank" style="color:var(--rust);">Open in a new tab &rarr;</a>`;
  }

  if(key === "credits"){
    return `${backBtn}
      <div class="detail-heading">Credits</div>
      <div class="detail-p">Idea, design direction &amp; testing — Bobby Chan</div>
      <div class="detail-p">Built with Claude</div>`;
  }

  if(key === "about"){
    return `${backBtn}
      <div class="detail-heading">About / Version</div>
      <div class="detail-p"><strong>Regnisamai — Reverse Singer</strong></div>
      <div class="detail-p">Version v1.0.0</div>
      <div class="detail-p">Last updated: August 12, 2026</div>
      <div class="detail-p">A retro cassette-deck recorder that plays your voice forwards or backwards, vari-speed included.</div>`;
  }

  return backBtn;
}

function wireDetailContent(key, detail){
  detail.querySelector("[data-back]").addEventListener("click", closeDetail);

  if(key === "profile"){
    const nameInput = detail.querySelector("#profileNameInput");
    nameInput.addEventListener("change", () => {
      const profile = readJSON(LS_PROFILE, { name:"", avatar:1 });
      profile.name = nameInput.value.trim();
      writeJSON(LS_PROFILE, profile);
    });
    detail.querySelectorAll("[data-avatar]").forEach(img => {
      img.addEventListener("click", () => {
        const profile = readJSON(LS_PROFILE, { name:"", avatar:1 });
        profile.avatar = parseInt(img.dataset.avatar, 10);
        writeJSON(LS_PROFILE, profile);
        detail.querySelectorAll("[data-avatar]").forEach(i => i.classList.remove("selected"));
        img.classList.add("selected");
      });
    });
  }

  if(key === "theme"){
    detail.querySelectorAll("[data-theme-id]").forEach(row => {
      row.addEventListener("click", () => {
        settings.theme = row.dataset.themeId;
        writeJSON(LS_THEME, settings.theme);
        applyTheme();
        detail.querySelectorAll(".theme-swatch-row").forEach(r => r.classList.remove("active"));
        row.classList.add("active");
      });
    });
  }

  if(key === "tutorial"){
    detail.querySelector("#replayTutorialBtn").addEventListener("click", () => {
      closeSettingsSheet();
      setTimeout(() => startTutorial(), 250);
    });
  }
}

/* ---------- sheet open/close ---------- */
function openSettingsSheet(){
  closeDetail();
  renderSettingsList();
  $("#settingsSheet").classList.remove("hidden");
}
function closeSettingsSheet(){
  $("#settingsSheet").classList.add("hidden");
  closeDetail();
}

/* ===================================================================
   ONBOARDING
=================================================================== */
let selectedAvatar = 1;

function buildAvatarFilmstrip(containerId, onSelect, initial){
  const strip = $(containerId);
  strip.innerHTML = "";
  for(let i=1;i<=AVATAR_COUNT;i++){
    const img = document.createElement("img");
    img.src = `./avatar-${i}.png`;
    img.className = "avatar-opt";
    img.dataset.avatar = i;
    img.alt = `Avatar ${i}`;
    strip.appendChild(img);
  }
  let ticking = false;
  function updateSelection(){
    const items = Array.from(strip.querySelectorAll(".avatar-opt"));
    const stripRect = strip.getBoundingClientRect();
    const center = stripRect.left + stripRect.width/2;
    let closest = null, closestDist = Infinity;
    items.forEach(item => {
      const r = item.getBoundingClientRect();
      const itemCenter = r.left + r.width/2;
      const dist = Math.abs(itemCenter - center);
      item.classList.remove("selected");
      if(dist < closestDist){ closestDist = dist; closest = item; }
    });
    if(closest){
      closest.classList.add("selected");
      const av = parseInt(closest.dataset.avatar, 10);
      onSelect(av);
    }
    ticking = false;
  }
  strip.addEventListener("scroll", () => {
    if(!ticking){
      ticking = true;
      requestAnimationFrame(updateSelection);
    }
  }, { passive:true });

  // scroll to initial avatar
  requestAnimationFrame(() => {
    const target = strip.querySelector(`[data-avatar="${initial}"]`);
    if(target){
      strip.scrollLeft = target.offsetLeft - (strip.clientWidth/2 - target.clientWidth/2);
    }
    updateSelection();
  });
}

function initOnboarding(){
  const done = readJSON(LS_ONBOARDING, false);
  if(done) return;

  $("#onboarding").classList.remove("hidden");
  buildAvatarFilmstrip("#avatarFilmstrip", (av) => { selectedAvatar = av; }, 1);

  const nameInput = $("#nameInput");
  const letsGo = $("#letsGoBtn");
  nameInput.addEventListener("input", () => {
    letsGo.disabled = nameInput.value.trim().length === 0;
  });

  letsGo.addEventListener("click", () => {
    const name = nameInput.value.trim();
    writeJSON(LS_PROFILE, { name, avatar: selectedAvatar });
    writeJSON(LS_ONBOARDING, true);
    $("#onboarding").classList.add("hidden");
    setTimeout(() => startTutorial(), 500);
  });
}

/* ===================================================================
   TUTORIAL (spotlight walkthrough)
=================================================================== */
const TUTORIAL_STEPS = [
  { target: "#reelsWrap", note: "This is the tape. Watch it spin and scroll while you record or play." },
  { target: "#keyCluster", note: "REC, PLAY, PAUSE, REV and STOP — your deck controls." },
  { target: "#variSpeed", note: "Vari-speed! Push pitch and speed together, tape-style — chipmunk to demonic." },
  { target: "#historySection", note: "Your last 5 takes live here. Swipe a row left to delete it." },
  { target: "#gearBtn", note: "Settings live behind the gear — profile, theme, and more." }
];
let tutorialIndex = 0;

function startTutorial(){
  tutorialIndex = 0;
  $("#tutorial").classList.remove("hidden");
  renderTutorialStep();
}

function renderTutorialStep(){
  const step = TUTORIAL_STEPS[tutorialIndex];
  const target = document.querySelector(step.target);
  const box = $("#spotlightBox");
  const note = $("#tutorialNote");

  if(target){
    const r = target.getBoundingClientRect();
    const pad = 10;
    box.style.top = `${r.top - pad}px`;
    box.style.left = `${r.left - pad}px`;
    box.style.width = `${r.width + pad*2}px`;
    box.style.height = `${r.height + pad*2}px`;

    const noteTop = r.bottom + 18 > window.innerHeight - 110 ? Math.max(20, r.top - 90) : r.bottom + 18;
    note.style.top = `${noteTop}px`;
    let noteLeft = r.left;
    if(noteLeft + 220 > window.innerWidth - 16) noteLeft = window.innerWidth - 236;
    note.style.left = `${Math.max(16, noteLeft)}px`;
  }

  note.innerHTML = `${step.note}<svg width="40" height="24" viewBox="0 0 40 24"><path d="M2 4 Q 20 2 34 16" stroke="${cssVar('--amber')}" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M27 12 L34 16 L28 20" stroke="${cssVar('--amber')}" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  $("#tutorialNext").textContent = tutorialIndex === TUTORIAL_STEPS.length - 1 ? "Got it!" : "Next";
}

function tutorialNext(){
  if(tutorialIndex >= TUTORIAL_STEPS.length - 1){
    finishTutorial();
    return;
  }
  tutorialIndex++;
  renderTutorialStep();
}
function finishTutorial(){
  writeJSON(LS_TUTORIAL_SEEN, true);
  $("#tutorial").classList.add("hidden");
}

/* ===================================================================
   INIT
=================================================================== */
function init(){
  els.keyRec = $("#keyRec");
  els.keyPlay = $("#keyPlay");
  els.keyPause = $("#keyPause");
  els.keyRev = $("#keyRev");
  els.keyStop = $("#keyStop");
  els.counter = $("#counter");
  els.statusText = $("#statusText");
  els.reelsWrap = $("#reelsWrap");

  applyTheme();
  updateSteppersUI();
  setState("idle");
  drawWaveform(null, null, "fwd");
  renderHistory();

  wireKeyPress(els.keyRec, startRecording);
  wireKeyPress(els.keyPlay, () => playDirection("fwd"));
  wireKeyPress(els.keyRev, () => playDirection("rev"));
  wireKeyPress(els.keyPause, pausePlayback);
  wireKeyPress(els.keyStop, stopEverything);

  $$('[data-adjust]').forEach(btn => {
    btn.addEventListener("click", () => {
      playClick();
      const dir = parseInt(btn.dataset.dir, 10);
      if(btn.dataset.adjust === "pitch") adjustPitch(dir);
      else adjustSpeed(dir);
    });
  });

  $("#gearBtn").addEventListener("click", openSettingsSheet);
  $("#sheetBackdrop").addEventListener("click", closeSettingsSheet);

  $("#tutorialSkip").addEventListener("click", finishTutorial);
  $("#tutorialNext").addEventListener("click", tutorialNext);
  window.addEventListener("resize", () => {
    if(!$("#tutorial").classList.contains("hidden")) renderTutorialStep();
    drawWaveform(currentWavePeaks, null, "fwd");
  });

  initOnboarding();

  // register service worker
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
}

document.addEventListener("DOMContentLoaded", init);

})();
</script>
